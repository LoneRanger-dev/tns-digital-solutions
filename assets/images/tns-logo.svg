<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 64" fill="none" width="100%" height="100%">
  <defs>
    <linearGradient id="tnsGradPrimary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="50%" stop-color="#4FACFE" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
    <linearGradient id="tnsGradSecondary" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <filter id="tnsGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Logo Mark Icon -->
  <g transform="translate(6, 8)">
    <!-- Tech Hexagon / Circuit Frame -->
    <rect x="2" y="2" width="44" height="44" rx="12" fill="#0B132B" stroke="url(#tnsGradPrimary)" stroke-width="2" />
    <path d="M12 16 H36 M24 16 V38" stroke="url(#tnsGradPrimary)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="34" cy="24" r="3" fill="#00F2FE" filter="url(#tnsGlow)" />
    <path d="M18 36 C22 32, 28 32, 32 36" stroke="#00F2FE" stroke-width="2" stroke-linecap="round" />
    <path d="M15 28 L24 20 L33 28" stroke="url(#tnsGradSecondary)" stroke-width="1.8" stroke-linecap="round" opacity="0.6" />
  </g>

  <!-- Typography: TnS DIGITAL SOLUTIONS -->
  <g transform="translate(64, 14)">
    <!-- Primary Brand Name -->
    <text x="0" y="24" font-family="'Outfit', 'Inter', -apple-system, sans-serif" font-size="26" font-weight="800" letter-spacing="-0.5">
      <tspan fill="#FFFFFF">Tn</tspan>
      <tspan fill="url(#tnsGradPrimary)">S</tspan>
    </text>
    <!-- Secondary Brand Name -->
    <text x="56" y="24" font-family="'Outfit', 'Inter', -apple-system, sans-serif" font-size="20" font-weight="600" fill="#F8FAFC" letter-spacing="0.5">
      Digital
    </text>
    <!-- Tagline Subtext -->
    <text x="1" y="38" font-family="'Inter', -apple-system, sans-serif" font-size="8.5" font-weight="700" fill="#38BDF8" letter-spacing="2.8">
      SOLUTIONS &amp; AI LABS
    </text>
  </g>
</svg>
